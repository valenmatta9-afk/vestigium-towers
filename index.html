<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1714">
<meta property="og:title" content="Vestigium">
<meta property="og:image" content="https://valenmatta9-afk.github.io/vestigium-towers/portada.jpg">
<meta property="og:url" content="https://valenmatta9-afk.github.io/vestigium-towers/">
<title>Vestigium</title>
<link rel="preload" as="image" href="portada.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;900&display=swap" rel="stylesheet">
<style>
/* Portada del QR: la foto aérea del conjunto a pantalla completa, solo el nombre y dos accesos.
   Paleta del edificio: hormigón visto cálido y la luz dorada de la tarde en Mendoza. */
:root {
  --night: #1b1714;          /* fondo mientras carga la foto */
  --concrete: #f1ebe2;       /* texto: hormigón claro */
  --concrete-dim: rgba(241, 235, 226, .72);
  --line: rgba(241, 235, 226, .38);
  --sun: #e8b06a;            /* luz de la tarde */
  --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --ui: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
/* La portada es siempre una foto: mismo aspecto en modo claro y oscuro. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --night: #1b1714; } }
:root[data-theme="dark"] { --night: #1b1714; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night); color: var(--concrete);
  font-family: var(--ui);
  overflow: hidden;
}
.cover { position: fixed; inset: 0; }
.cover img {
  width: 100%; height: 100%; object-fit: cover;
  object-position: 52% 45%;   /* la torre queda centrada también en celular */
  animation: settle 2.6s cubic-bezier(.2,.7,.2,1) both;
}
/* Velo: oscurece arriba (nombre) y abajo (botones) sin tapar la torre */
.cover::after {
  content: ''; position: absolute; inset: 0;
  background:
    linear-gradient(to bottom, rgba(20,16,13,.62) 0%, rgba(20,16,13,.12) 32%, rgba(20,16,13,0) 50%, rgba(20,16,13,.18) 66%, rgba(20,16,13,.78) 100%);
}
main {
  position: relative; z-index: 1;
  height: 100%;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
h1 {
  margin: 4vh 0 0;
  font-family: var(--display); font-weight: 900; text-transform: uppercase;
  font-size: clamp(64px, 15vw, 210px); line-height: .82; letter-spacing: .06em;
  padding-left: .06em; /* compensa el tracking para centrar */
  text-shadow: 0 2px 30px rgba(0,0,0,.25);
  animation: rise 1.6s .2s cubic-bezier(.2,.7,.2,1) both;
}
nav {
  width: 100%; max-width: 640px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  animation: rise 1.4s .6s cubic-bezier(.2,.7,.2,1) both;
}
nav a {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  min-height: 62px; padding: 0 22px;
  font-family: var(--display); font-weight: 500; font-size: 24px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--concrete); text-decoration: none;
  border: 1px solid var(--line);
  background: rgba(27, 23, 20, .34);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: background .25s, border-color .25s, color .25s;
}
nav a svg { flex: none; transition: transform .25s; }
nav a:hover, nav a:focus-visible { background: var(--concrete); border-color: var(--concrete); color: var(--night); }
nav a:hover svg, nav a:focus-visible svg { transform: translateX(4px); }
nav a:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
nav a.primary { border-color: var(--sun); }
@keyframes settle { from { transform: scale(1.06); filter: brightness(.7); } to { transform: none; filter: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .cover img, h1, nav { animation: none; } }
@media (max-width: 560px) {
  h1 { font-size: clamp(56px, 19vw, 110px); margin-top: 6vh; }
  nav { grid-template-columns: 1fr; gap: 10px; }
  nav a { min-height: 58px; font-size: 22px; }
}
</style>
</head>
<body>
<div class="cover" aria-hidden="true">
  <img src="portada.jpg" width="2200" height="1228" alt="">
</div>
<main>
  <h1>Vestigium</h1>
  <nav aria-label="Contenido del proyecto">
    <a class="primary" href="web/index.html">
      <span>Página web</span>
      <svg width="26" height="14" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h24M19 1l6 6-6 6"/></svg>
    </a>
    <a href="web/documentacion.html">
      <span>Documentación técnica</span>
      <svg width="26" height="14" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h24M19 1l6 6-6 6"/></svg>
    </a>
  </nav>
</main>
</body>
</html>
